[package]
name = "lyra-viewer"
version = "0.1.0"
description = "Lyra Viewer — File reader"
authors = ["David Montenegro"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "lyra_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
lopdf = "0.45.0"
notify = "8.2.0"
percent-encoding = "2"
sha2 = "0.11.1"
sysinfo = "0.32"
hex = "0.4.3"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
